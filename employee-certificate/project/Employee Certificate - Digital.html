<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Certificate of Recognition — Premium Health (Digital)</title>
<meta name="ext-resource-dependency" content="assets/logos/horizontal-full-color.svg" data-resource-id="logo" />
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: var(--font-body);
    color: var(--color-white);
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 50% 30%, rgba(84,63,104,0.55), transparent 70%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(50,136,155,0.45), transparent 70%),
      radial-gradient(ellipse 50% 40% at 15% 85%, rgba(113,177,126,0.30), transparent 70%),
      #14141a;
  }
  body.bg-light {
    color: var(--color-off-black);
    background: var(--color-cream);
  }
  body.bg-dark {
    background:
      radial-gradient(ellipse 80% 60% at 50% 30%, rgba(84,63,104,0.55), transparent 70%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(50,136,155,0.45), transparent 70%),
      radial-gradient(ellipse 50% 40% at 15% 85%, rgba(113,177,126,0.30), transparent 70%),
      #14141a;
  }
  body.bg-cream {
    background:
      radial-gradient(ellipse 70% 50% at 50% 25%, rgba(183,132,73,0.18), transparent 70%),
      #efe7dc;
    color: var(--color-off-black);
  }
  body.bg-velvet {
    background:
      radial-gradient(ellipse 80% 70% at 50% 40%, rgba(183,132,73,0.30), transparent 70%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(84,63,104,0.55), transparent 70%),
      #1a1115;
  }

  /* Ambient bg grain */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.04) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.03) 0, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Stage — perspective ──────────────────────────── */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1800px;
    perspective-origin: 50% 50%;
    z-index: 1;
  }

  /* The floating wrapper — gentle bob, drives tilt + scale */
  .float {
    --rx: 0;            /* mouse y normalized -1..1 → rotateX */
    --ry: 0;            /* mouse x normalized -1..1 → rotateY */
    --tilt: 14deg;
    --float-y: 10px;
    --float-x: 6px;
    --float-rot: 1.2deg;
    transform-style: preserve-3d;
    will-change: transform;
    animation: floatBob 7s ease-in-out infinite;
  }

  @keyframes floatBob {
    0%   { transform: translate3d(0, calc(var(--float-y) * -1), 0) rotateZ(calc(var(--float-rot) * -1)); }
    50%  { transform: translate3d(var(--float-x), var(--float-y), 0) rotateZ(var(--float-rot)); }
    100% { transform: translate3d(0, calc(var(--float-y) * -1), 0) rotateZ(calc(var(--float-rot) * -1)); }
  }
  body.no-float .float { animation: none; transform: none; }

  /* The card — tracks tilt */
  .tilt {
    transform-style: preserve-3d;
    transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
    transform:
      rotateX(calc(var(--rx) * var(--tilt) * -1))
      rotateY(calc(var(--ry) * var(--tilt)));
  }
  body.dragging .tilt { transition: none; }

  /* ── Certificate (mirrors print styling) ──────────── */
  .cert-3d {
    --cw: 1100px;
    --ch: 850px;
    position: relative;
    width: var(--cw);
    height: var(--ch);
    transform-style: preserve-3d;
    filter: drop-shadow(0 40px 70px rgba(0,0,0,0.55))
            drop-shadow(0 10px 20px rgba(0,0,0,0.35));
  }

  .cert {
    width: 100%; height: 100%;
    background: var(--color-cream);
    color: var(--color-off-black);
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    padding: 52px 68px 56px;
    display: flex;
    flex-direction: column;
    border-radius: 6px;
    backface-visibility: hidden;
  }

  /* ── Holographic layers ───────────────────────────── */

  /* Iridescent base — conic gradient that rotates with shine angle */
  .holo-base {
    position: absolute;
    inset: 0;
    border-radius: 6px;
    pointer-events: none;
    opacity: var(--holo-strength, 0.55);
    mix-blend-mode: color-dodge;
    background:
      conic-gradient(
        from var(--shine-angle, 220deg) at var(--shine-x, 50%) var(--shine-y, 50%),
        rgba(84,63,104,0.0),
        rgba(84,63,104,0.95) 12%,
        rgba(50,136,155,0.95) 28%,
        rgba(113,177,126,0.95) 44%,
        rgba(235,224,101,0.95) 60%,
        rgba(183,132,73,0.95) 76%,
        rgba(84,63,104,0.95) 92%,
        rgba(84,63,104,0.0) 100%
      );
    z-index: 4;
  }

  /* Iridescent diagonal stripes */
  .holo-stripes {
    position: absolute;
    inset: 0;
    border-radius: 6px;
    pointer-events: none;
    opacity: var(--holo-strength, 0.55);
    mix-blend-mode: overlay;
    background:
      repeating-linear-gradient(
        var(--stripe-angle, 110deg),
        rgba(255,255,255,0) 0px,
        rgba(255,255,255,0.06) 2px,
        rgba(84,63,104,0.10) 4px,
        rgba(50,136,155,0.10) 8px,
        rgba(113,177,126,0.10) 12px,
        rgba(235,224,101,0.10) 16px,
        rgba(255,255,255,0) 22px
      );
    z-index: 5;
  }

  /* Specular shine — bright reflection that tracks angle */
  .shine {
    position: absolute;
    inset: 0;
    border-radius: 6px;
    pointer-events: none;
    opacity: var(--shine-strength, 0.7);
    mix-blend-mode: screen;
    background:
      radial-gradient(
        circle at var(--shine-x, 50%) var(--shine-y, 30%),
        rgba(255,255,255,0.85) 0%,
        rgba(255,255,255,0.45) 8%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0.0) 38%
      );
    z-index: 6;
  }

  /* Edge highlight */
  .edge {
    position: absolute;
    inset: 0;
    border-radius: 6px;
    pointer-events: none;
    z-index: 7;
    background:
      linear-gradient(
        135deg,
        rgba(255,255,255,0.4) 0%,
        rgba(255,255,255,0) 12%,
        rgba(255,255,255,0) 88%,
        rgba(255,255,255,0.25) 100%
      );
    mix-blend-mode: overlay;
    opacity: 0.7;
  }

  /* Grain overlay */
  .grain {
    position: absolute;
    inset: 0;
    border-radius: 6px;
    pointer-events: none;
    z-index: 8;
    opacity: 0.18;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNjAiIGhlaWdodD0iMTYwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC45IiBudW1PY3RhdmVzPSIyIiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PGZlQ29sb3JNYXRyaXggdmFsdWVzPSIwIDAgMCAwIDEgMCAwIDAgMCAxIDAgMCAwIDAgMSAwIDAgMCAwLjUgMCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==");
  }

  /* Hide holo when disabled */
  body.no-holo .holo-base,
  body.no-holo .holo-stripes,
  body.no-holo .edge,
  body.no-holo .grain { display: none; }
  body.no-shine .shine { display: none; }

  /* ── Frame (gold double border) ───────────────────── */
  .frame-outer, .frame-inner {
    position: absolute;
    pointer-events: none;
    z-index: 2;
  }
  .frame-outer {
    inset: 30px;
    border: 1.5px solid var(--color-gold);
  }
  .frame-inner {
    inset: 38px;
    border: 0.5px solid var(--color-gold);
    opacity: 0.55;
  }

  /* Corner ornaments */
  .corner {
    position: absolute;
    width: 64px;
    height: 64px;
    pointer-events: none;
    z-index: 3;
  }
  .corner svg { width: 100%; height: 100%; display: block; }
  .corner.tl { top: 30px; left: 30px; }
  .corner.tr { top: 30px; right: 30px; transform: scaleX(-1); }
  .corner.bl { bottom: 30px; left: 30px; transform: scaleY(-1); }
  .corner.br { bottom: 30px; right: 30px; transform: scale(-1,-1); }

  /* Premium Health icon watermark — bottom-right */
  .cert-watermark {
    position: absolute;
    right: -120px;
    bottom: -140px;
    width: 600px;
    height: auto;
    opacity: 0.28;
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: multiply;
    user-select: none;
  }

  /* ── Content layout (same vocabulary as print) ────── */
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .logo { height: 60px; display: block; }
  .head-meta {
    text-align: right;
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--color-gold);
    line-height: 1.6;
  }
  .head-meta .seal {
    display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px;
    border: 1px solid var(--color-gold);
    border-radius: 50%;
    color: var(--color-gold);
    font-family: var(--font-display); font-weight: 700;
    font-size: 18px; margin-bottom: 8px; letter-spacing: 0;
  }

  .award-label {
    margin-top: 26px;
    text-align: center;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--color-gold);
  }
  .award-label::before,
  .award-label::after {
    content: '';
    display: inline-block;
    width: 36px; height: 1px;
    background: var(--color-gold);
    vertical-align: middle;
    margin: 0 18px;
    transform: translateY(-2px);
  }
  .award-title {
    margin: 12px 0 0;
    text-align: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 0.04em;
    color: var(--color-off-black);
    text-transform: uppercase;
  }

  .stage-text {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    margin-top: 6px;
  }
  .preamble {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 300;
    font-size: 22px;
    color: var(--fg-secondary);
    margin: 0 0 18px;
  }
  .recipient-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 78px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--color-off-black);
    margin: 0;
    padding: 0 12px 8px;
    border-bottom: 1px solid rgba(183,132,73,0.35);
    display: inline-block;
    min-width: 540px;
  }
  .recipient-role {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--color-gold);
    margin: 18px 0 26px;
  }
  .citation {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 22px;
    line-height: 1.55;
    color: var(--color-off-black);
    max-width: 720px;
    margin: 0;
    text-wrap: pretty;
  }
  .citation em {
    font-style: italic;
    color: var(--color-gold);
    font-weight: 600;
  }

  .sigs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 52px;
    margin-top: 32px;
  }
  .sig {
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .sig-line {
    width: 100%; height: 1px;
    background: var(--color-off-black);
    opacity: 0.4;
    margin-bottom: 8px;
    position: relative;
  }
  .sig-script {
    position: absolute;
    bottom: 4px; left: 50%;
    transform: translateX(-50%) rotate(-4deg);
    font-family: var(--font-script);
    color: var(--color-off-black);
    opacity: 0.7;
    font-size: 24px;
    white-space: nowrap;
  }
  .sig-name {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--color-off-black);
  }
  .sig-title {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--fg-secondary);
    margin-top: 3px;
  }

  .foot {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: 22px;
  }
  .foot-meta {
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-tertiary);
    line-height: 1.6;
  }
  .foot-date { text-align: center; }
  .foot-date .lbl {
    font-family: var(--font-body);
    font-size: 9px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--color-gold);
    margin-bottom: 4px;
  }
  .foot-date .val {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    color: var(--color-off-black);
  }
  .tagline {
    font-family: var(--font-script);
    font-size: 22px;
    color: var(--color-gold);
    line-height: 1;
    text-align: right;
    transform: translateY(-2px);
  }

  /* ── Help / instructions ──────────────────────────── */
  .hint {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.05);
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    z-index: 100;
    pointer-events: none;
  }
  body.bg-cream .hint, body.bg-light .hint {
    color: rgba(52,52,54,0.6);
    background: rgba(255,255,255,0.6);
    border-color: rgba(52,52,54,0.1);
  }

  /* ── Download control ─────────────────────────────── */
  .download-btn {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 100;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.9);
    background: rgba(183,132,73,0.92);
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.2);
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    transition: transform 120ms ease, background 120ms ease;
  }
  .download-btn:hover { transform: translateY(-1px); background: #c49258; }
  .download-btn:disabled {
    opacity: 0.65;
    cursor: wait;
    transform: none;
  }
  body.bg-cream .download-btn, body.bg-light .download-btn {
    box-shadow: 0 4px 16px rgba(52,52,54,0.15);
  }

  /* ── Scale-to-fit ─────────────────────────────────── */
  @media (max-width: 1280px), (max-height: 980px) {
    .cert-3d {
      transform: scale(0.78);
      transform-origin: center;
    }
  }
  @media (max-width: 960px), (max-height: 780px) {
    .cert-3d { transform: scale(0.6); }
  }
  @media (max-width: 720px) {
    .cert-3d { transform: scale(0.45); }
  }
</style>
</head>
